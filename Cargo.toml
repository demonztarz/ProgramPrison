[package]
name = "programprison"
version = "0.2.0"
edition = "2024"
description = "Block distracting websites and programs on a timer or a weekly schedule, with locks that are hard to undo."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "programprison"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
scrypt = { version = "0.12", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui = "0.37"
egui_kittest = "0.37"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimize dependencies even in debug builds (scrypt is very slow unoptimized).
[profile.dev.package."*"]
opt-level = 2
