name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows is the main platform: it tests and builds in one job and never waits for, or is
  # held up by, macOS or Linux.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests, the background blocker end to end (on Windows: covering Notepad), and a
      # headless click-through of the settings window.
      - name: Tests
        run: cargo test -- --nocapture
        timeout-minutes: 15
      - name: Version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Build (Windows)
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\programprison.exe "out\Program Prison.exe"
          Copy-Item assets\README.txt "out\README.txt"
          $json = Join-Path $env:RUNNER_TEMP "selftest.json"
          Start-Process -FilePath target\release\programprison.exe -ArgumentList "--self-test=$json" -Wait
          Get-Content $json
          if (-not (Get-Content $json | ConvertFrom-Json).ok) { throw "self-test failed" }
          # Open the real window on a fresh machine and time the first screen.
          $env:PROGRAMPRISON_DATA = Join-Path $env:RUNNER_TEMP "ppdata"
          $smoke = Join-Path $env:RUNNER_TEMP "smoke.json"
          $p = Start-Process -FilePath target\release\programprison.exe -ArgumentList "--gui-smoke=$smoke" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Get-Content "$env:PROGRAMPRISON_DATA\programprison.log"; throw "window did not draw within 60 s" }
          Get-Content "$env:PROGRAMPRISON_DATA\programprison.log"
          if (-not (Test-Path $smoke)) { throw "the window closed without drawing (log above)" }
          Get-Content $smoke
          if (-not (Get-Content $smoke | ConvertFrom-Json).ok) { throw "window smoke test failed" }
          Stop-Process -Name programprison -Force -ErrorAction SilentlyContinue

      - name: Installer (build, install, refuse uninstall while locked, uninstall)
        shell: pwsh
        timeout-minutes: 12
        run: |
          # Runs a program and fails (instead of hanging) if it doesn't finish in time.
          function Run-Wait($file, $argList, $secs = 180) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit($secs * 1000)) { $p.Kill(); throw "$file $argList did not finish within $secs s" }
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" installer\programprison.iss
          if ($LASTEXITCODE) { throw "building the installer failed" }
          $setup = (Resolve-Path "out\Program Prison Setup $env:VERSION.exe").Path
          $app = "$env:LOCALAPPDATA\Programs\Program Prison"

          # Install silently for this user (no admin) and check what landed.
          Run-Wait $setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART')
          if (-not (Test-Path "$app\programprison.exe")) { throw "not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Program Prison.lnk")) { throw "no Start menu shortcut" }
          $json = Join-Path $env:RUNNER_TEMP "installed-selftest.json"
          Run-Wait "$app\programprison.exe" @("--self-test=$json") 60
          if (-not (Get-Content $json | ConvertFrom-Json).ok) { throw "installed copy failed its self-test" }
          Write-Host "installed and working"

          # A locked block is running: uninstalling must be refused.
          $env:PROGRAMPRISON_DATA = Join-Path $env:RUNNER_TEMP "locked-data"
          New-Item -ItemType Directory -Force $env:PROGRAMPRISON_DATA | Out-Null
          $ends = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() + 3600000
          Set-Content "$env:PROGRAMPRISON_DATA\state.json" "{`"version`":2,`"blocks`":[{`"id`":`"t`",`"name`":`"T`",`"sites`":[`"example.com`"],`"lock`":{`"type`":`"locked`"},`"session`":{`"startedAt`":0,`"endsAt`":$ends}}]}"
          Run-Wait "$app\unins000.exe" @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART')
          Start-Sleep 8
          if (-not (Test-Path "$app\programprison.exe")) { throw "uninstalled during a locked block" }
          Write-Host "uninstall refused while locked"

          # No locked block: uninstall removes it.
          Remove-Item -Recurse -Force $env:PROGRAMPRISON_DATA
          Run-Wait "$app\unins000.exe" @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART')
          # The uninstaller hands over to a copy of itself and returns at once: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\programprison.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\programprison.exe") { throw "uninstall left the program behind" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Program Prison.lnk") { throw "uninstall left the shortcut behind" }
          Write-Host "uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: Program Prison - windows
          path: out/*
          if-no-files-found: error

  # macOS and Linux build alongside, but a failure there never blocks the Windows download.
  other:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      # Unit tests, the background blocker end to end (on Windows: covering Notepad), and a
      # headless click-through of the settings window.
      - name: Tests
        run: cargo test -- --nocapture
        timeout-minutes: 15
      - name: Version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Build (macOS, universal app)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP="out/Program Prison.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/programprison" target/aarch64-apple-darwin/release/programprison target/x86_64-apple-darwin/release/programprison
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon-256.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-256.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/ProgramPrison.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Program Prison</string>
          <key>CFBundleDisplayName</key><string>Program Prison</string>
          <key>CFBundleIdentifier</key><string>app.programprison</string>
          <key>CFBundleVersion</key><string>$VERSION</string>
          <key>CFBundleShortVersionString</key><string>$VERSION</string>
          <key>CFBundleExecutable</key><string>programprison</string>
          <key>CFBundleIconFile</key><string>ProgramPrison</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
          "$APP/Contents/MacOS/programprison" --self-test=selftest.json && cat selftest.json && grep -q '"ok": true' selftest.json
          cp assets/README.txt out/README.txt
          cd out && ditto -c -k --keepParent "Program Prison.app" "Program Prison $VERSION (macOS).zip" && rm -rf "Program Prison.app"

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo build --release
          ./target/release/programprison --self-test=selftest.json && cat selftest.json && grep -q '"ok": true' selftest.json
          mkdir -p "out/Program Prison"
          cp target/release/programprison assets/README.txt assets/icon-256.png "out/Program Prison/"
          tar -C out -czf "out/program-prison-$VERSION-linux-x64.tar.gz" "Program Prison"
          rm -rf "out/Program Prison"

      - uses: actions/upload-artifact@v4
        with:
          name: Program Prison - ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # A tagged release goes out as soon as Windows passes; macOS and Linux files are included
  # when they built.
  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    needs: [windows, other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
