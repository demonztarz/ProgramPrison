name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end test (real app, Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:e2e
      - name: End-to-end test (real app, includes window covering on Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            files: dist/*.exe
          - os: macos-latest
            args: --mac dmg
            files: dist/*.dmg
          - os: ubuntu-latest
            args: --linux AppImage
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Self-test the packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\win-unpacked\ProgramPrison.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          Start-Process -FilePath $exe -ArgumentList "--self-test=$out" -Wait
          Get-Content $out
          $r = Get-Content $out | ConvertFrom-Json
          if (-not $r.ok -or -not $r.nativeProcessList) { throw "packaged self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ProgramPrison-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
